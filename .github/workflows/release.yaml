name: Release project

check-tag:
  if: startsWith(github.ref, 'refs/tags/') # Only run this job for tags
  runs-on: ubuntu-latest

  steps:
    - name: Check tag format
      run: | # Validate that the tag follows the format vX.Y.Z
        if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid tag format: ${{ github.ref_name }}. Expected format: v1.0.0"
          exit 1
        fi
        echo "Tag format is valid: ${{ github.ref_name }}"

release:
  needs: check-tag
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        body: |
          ## ${{ github.ref_name }}
